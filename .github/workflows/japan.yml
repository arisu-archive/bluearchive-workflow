name: Update Japan Version

on:
  schedule:
    # Check every 2 hours from 01:00 (10:00 JST) to 14:00 (23:00 JST) everyday
    - cron: "0 1-14/2 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        type: boolean
        required: false
        description: "Force update the game version"
      package_name:
        type: string
        required: false
        description: "The package name of the APK"
        default: "com.YostarJP.BlueArchive"
      apk_url:
        type: string
        required: false
        description: "Direct URL to the APK to download (overrides package name)"
        default: ""
      override_version:
        type: string
        required: false
        description: "Override the detected version"
        default: ""

env:
  PACKAGE_NAME: ${{ inputs.package_name || 'com.YostarJP.BlueArchive' }}
  APK_URL: ${{ inputs.apk_url || '' }}
  FORCE_UPDATE: ${{ inputs.force_update || 'false' }}
  OVERRIDE_VERSION: ${{ inputs.override_version || '' }}

jobs:
  inspect-apk:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.inspect-apk.outputs.skip }}
      version: ${{ steps.inspect-apk.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions/apk_inspector/
            scripts/
            .tools/Il2CppInspector
            requirements.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      - name: Inspect APK
        id: inspect-apk
        uses: ./.github/actions/apk_inspector
        with:
          package_name: ${{ env.PACKAGE_NAME }}
          force_update: ${{ env.FORCE_UPDATE }}
          blacklist_versions: ${{ vars.JAPAN_BLACKLISTED_VERSIONS || '' }}
          apk_url: ${{ env.APK_URL || '' }}
          override_version: ${{ env.OVERRIDE_VERSION || '' }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        if: steps.inspect-apk.outputs.skip == 'false'
        shell: bash
        run: |
          sudo apt-get install ripgrep
      - name: Prepare for decompilation
        if: steps.inspect-apk.outputs.skip == 'false'
        run: |
          pip install -r requirements.txt
          mkdir -p ./tmp/Data
          unzip output.xapk
          unzip -j config.arm64_v8a.apk "lib/arm64-v8a/*" -d arm64-v8a
          unzip -p ${{ env.PACKAGE_NAME }}.apk assets/bin/Data/Managed/Metadata/global-metadata.dat > global-metadata.dat
          unzip -j UnityDataAssetPack.apk "assets/bin/Data/*" -d ./tmp/Data/
          wrapper=$(python ./scripts/appsign_scan.py arm64-v8a --json | jq -r '.[] | select(.kind == "appsign-wrapper") | .path')
          python ./scripts/appsign_unpack.py "$wrapper" -o .
      - name: Decompile APK
        id: decompile-apk
        if: steps.inspect-apk.outputs.skip == 'false'
        run: ./scripts/decompile.sh
      - name: Extract bundle version
        id: extract-bundle-version
        if: steps.inspect-apk.outputs.skip == 'false'
        run: |
          python ./scripts/dump_config.py -i ./tmp/Data/ -o ./tmp/GameMainConfig.bytes
          python ./scripts/decrypt_config.py -i ./tmp/GameMainConfig.bytes -o ./GameMainConfig.json
      - name: Upload to S3
        if: steps.inspect-apk.outputs.skip == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT }}
        run: |
          : "${AWS_ENDPOINT_URL:?S3_ENDPOINT must be set}"
          echo -n "${{ steps.inspect-apk.outputs.version }}" > version.txt
          echo -n "${{ steps.decompile-apk.outputs.offset }}" > offset.txt
          zip -r decompiled.zip ./DiffableCs/
          aws s3 cp ./version.txt s3://bluearchive/${{ env.PACKAGE_NAME }}/version.txt
          aws s3 cp ./output.xapk s3://bluearchive/${{ env.PACKAGE_NAME }}/apks/${{ steps.inspect-apk.outputs.version }}/output.xapk
          aws s3 cp ./libil2cpp.so s3://bluearchive/${{ env.PACKAGE_NAME }}/libraries/${{ steps.inspect-apk.outputs.version }}/libil2cpp.so
          aws s3 cp ./global-metadata.dat s3://bluearchive/${{ env.PACKAGE_NAME }}/libraries/${{ steps.inspect-apk.outputs.version }}/global-metadata.dat
          aws s3 cp ./offset.txt s3://bluearchive/${{ env.PACKAGE_NAME }}/decompiled/${{ steps.inspect-apk.outputs.version }}/offset.txt
          aws s3 cp ./decompiled.zip s3://bluearchive/${{ env.PACKAGE_NAME }}/decompiled/${{ steps.inspect-apk.outputs.version }}/decompiled.zip
          aws s3 cp ./GameMainConfig.json s3://bluearchive/${{ env.PACKAGE_NAME }}/decompiled/${{ steps.inspect-apk.outputs.version }}/GameMainConfig.json
          aws s3 cp ./key.pem s3://bluearchive/${{ env.PACKAGE_NAME }}/decompiled/${{ steps.inspect-apk.outputs.version }}/key.pem
